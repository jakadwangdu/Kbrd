<!DOCTYPE html>
<html lang="en" data-theme="amoled">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keymold Keyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e5de;--screen:#faf8f4;--kb:#e4e0d9;--key:#fff;--key2:#cfcac1;--text:#1d1a16;--mute:#554e45;--line:rgba(0,0,0,.08);--accent:#f0a93b;--ink:#1a1204;
--ef:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji";box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dim"]{--bg:#0b0a09;--screen:#141210;--kb:#1b1917;--key:#2b2825;--key2:#201e1b;--text:#f3ede4;--mute:#a39b90;--line:rgba(255,255,255,.07)}
:root[data-theme="amoled"]{--bg:#000;--screen:#000;--kb:#000;--key:#161616;--key2:#262626;--text:#f5f5f5;--mute:#a3a3a3;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(70% 45% at 50% 100%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),radial-gradient(50% 30% at 50% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent),var(--bg);color:var(--text);font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif,var(--ef);display:flex;justify-content:center;overflow:hidden}
button{font-family:inherit}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;padding:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(390px,100%);flex-wrap:wrap;position:relative}
.mark{font-family:Syne,system-ui,sans-serif;font-weight:700;font-size:18px}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--kb);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button,.ctl>button{border:0;background:none;color:var(--mute);font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--key);color:var(--text)}
.ctl>button{background:var(--kb);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop{position:absolute;top:100%;right:0;margin-top:8px;background:var(--key);border:1px solid var(--line);border-radius:16px;padding:12px;display:none;z-index:5;width:250px;font-size:12px;color:var(--mute)}
.pop.on{display:block}
.pop .r{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}.pop .r:last-child{margin-bottom:0}
.pop button{border:0;background:var(--key2);color:var(--text);font-size:12px;padding:6px 11px;border-radius:999px}
.pop button.on{outline:2px solid var(--accent)}
.pop .dot{width:26px;height:26px;padding:0}
.phone{position:relative;width:min(390px,100%);height:min(780px,calc(100dvh - 96px));background:linear-gradient(180deg,var(--screen),color-mix(in srgb,var(--accent) 7%,var(--screen)));box-shadow:0 40px 120px color-mix(in srgb,var(--accent) 16%,transparent);border-radius:40px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.status{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:12px;color:var(--mute)}
.to{padding:18px 24px 0;font-size:13px;color:var(--mute)}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.msg{flex:1;min-height:0;padding:14px 24px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--ink);padding:9px 14px;border-radius:18px 18px 4px 18px;font-size:16px;white-space:pre-wrap;word-break:break-word}
.bub img,.th{display:block;max-width:100%;max-height:120px;border-radius:10px;margin-bottom:6px}
.text{margin-top:auto;font-size:22px;line-height:1.35;white-space:pre-wrap;word-break:break-word;min-height:1.35em}
.ph{color:var(--mute)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:text-bottom;margin-left:1px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.kb{background:color-mix(in srgb,var(--kb) 80%,transparent);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);contain:layout paint;padding:6px 6px 10px;--kh:54px;height:calc(40px + 4*(var(--kh) + 8px) + 22px);display:flex;flex-direction:column;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-top:1px solid var(--line)}
.sug{display:flex;height:40px;align-items:center}
.sug button{flex:1;border:0;background:none;color:var(--text);font-size:16px;height:100%;border-right:1px solid var(--line)}
.sug button.ic{flex:none;width:44px;color:var(--mute);border:0;display:flex;align-items:center;justify-content:center}
.sug svg,.k svg,.qbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.row{display:flex;gap:6px;height:var(--kh)}
.row.pad{padding:0 5%}
.k{flex:1;border:0;border-radius:10px;background:var(--key);color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center;transition:transform .06s,background .06s;min-width:0;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);will-change:transform}
.k.on{transform:scale(.93);background:var(--key2)}
.k.fn{flex:1.45;background:var(--key2);font-size:15px;color:var(--mute)}
.k.fn.act{background:var(--text);color:var(--bg)}
.k.sp{flex:5;font-size:12px;color:var(--mute)}
.k.en{flex:1.45;background:var(--accent);color:var(--ink)}
.packs{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:none}
.packs button{border:0;background:var(--key2);color:var(--mute);font-size:13px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.packs button.on{background:var(--accent);color:var(--ink)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);align-content:start;font-family:var(--ef);scrollbar-width:none}
.grid button,.res button{border:0;background:none;font-family:var(--ef);font-size:26px;height:46px;border-radius:10px;padding:0}
.grid button:active{background:var(--key2)}
.grid.lg{grid-template-columns:repeat(5,1fr)}.grid.lg button{font-size:36px;height:62px}
.tabs{display:flex;align-items:center;gap:2px;flex:none;height:44px}
.tabs button{flex:1;border:0;background:none;font-size:19px;height:38px;border-radius:10px;opacity:.5;font-family:var(--ef)}
.tabs button.on{opacity:1;background:var(--key2)}
.tabs .k{flex:none;width:52px;height:38px;font-size:14px;opacity:1;font-family:inherit}
.mini .row{flex:1;height:auto;min-height:0}.mini .k{font-size:16px;border-radius:8px}
.qbar{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:12px;background:var(--key);font-size:16px;flex:none}
.qbar svg{width:18px;stroke:var(--mute)}
.res{display:flex;gap:2px;overflow-x:auto;height:44px;flex:none;align-items:center;scrollbar-width:none}
.res button{height:40px;padding:0 6px}
.chd{display:flex;justify-content:space-between;align-items:center;flex:none;font-size:14px;padding:2px 4px}
.chd button{border:0;background:var(--key2);color:var(--text);font-size:12px;padding:6px 11px;border-radius:999px;margin-left:6px}
.cg{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;scrollbar-width:none}
.cg p{grid-column:1/3;margin:20px 8px;font-size:13px}
.cc{position:relative;background:var(--key);border-radius:12px;overflow:hidden}
.cc>button:first-child{width:100%;min-height:64px;border:0;background:none;color:var(--text);font-size:13px;text-align:left;padding:10px 26px 10px 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cc>button.im{display:block;padding:0;min-height:0}.cc img{display:block;width:100%;height:82px;object-fit:cover}
.cc .x{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--mute);font-size:17px}
.vo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 12px}
.vo p{margin:0;font-size:14px;max-width:300px}.vo .hint{font-size:12px;color:var(--mute)}
.langs{display:flex;gap:6px}.langs button{border:0;background:var(--key2);color:var(--mute);font-size:13px;padding:6px 14px;border-radius:999px}.langs button.on{background:var(--accent);color:var(--ink)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--key);color:var(--text);display:flex;align-items:center;justify-content:center}
.mic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mic.live{background:var(--accent);color:var(--ink);animation:pl 1.4s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.pv{position:absolute;z-index:6;width:54px;height:62px;border-radius:14px;background:var(--text);color:var(--bg);font-size:30px;display:none;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translate(-50%,-100%)}
.pv.on{display:flex}
.sug{transition:opacity .15s}
.kb.typing .sug{opacity:0;pointer-events:none}
.kb{width:var(--kw,100%);align-self:var(--ka,center)}
.pop{max-height:72dvh;overflow:auto}
.pop input[type=range]{accent-color:var(--accent)}
.k{transition:transform .22s cubic-bezier(.3,1.7,.5,1),background .2s,box-shadow .25s}
.k.on{transition-duration:.04s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 16px color-mix(in srgb,var(--accent) 38%,transparent)}
.kb{transition:border-color .25s}.kb.typing{border-top-color:var(--accent)}
.bub.new{animation:bubin .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.9)}}
.grid button{transition:transform .12s}.grid button:active{transform:scale(1.3);background:none}
.grid,.cg,.msg{scroll-behavior:smooth;overscroll-behavior:contain}
html.ime body{background:var(--kb)}
.ime .bar,.ime .status,.ime .to,.ime .msg{display:none}
.ime .stage{padding:0;gap:0;justify-content:flex-end}
.ime .phone{height:auto;width:100%;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:visible}
.ime .kb{background:var(--kb);backdrop-filter:none;-webkit-backdrop-filter:none}
.ime .toast{top:8px}
.body.in{animation:in .18s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.985)}}
.packs .srch{display:flex;align-items:center;gap:8px;flex:1 0 160px;background:var(--key);color:var(--text);border:1px solid var(--line)}
.srch svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.chips{display:flex;gap:6px;height:44px;align-items:center;overflow-x:auto;flex:none;scrollbar-width:none}
.chips button{border:0;background:var(--key);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
@media (max-width:430px){.stage{padding:0;gap:0;justify-content:flex-start}.bar{padding:10px 14px}.phone{height:calc(100dvh - 58px);border-radius:0;border:0}}
@media (prefers-reduced-motion:reduce){.caret,.mic.live,.body.in{animation:none}.k{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="bar">
    <span class="mark">Keymold</span>
    <div class="ctl">
      <div class="seg" id="sizes" aria-label="Key size"><button data-h="54" class="on">Fitted</button><button data-h="48">Compact</button><button data-h="60">Roomy</button></div>
      <button id="theme" aria-expanded="false">Theme</button>
    </div>
    <div class="pop" id="pop"></div>
  </div>
  <section class="phone">
    <div class="status"><span>9:41</span><span>5G</span></div>
    <div class="to">New message</div>
    <div class="toast" id="toast" role="status"></div>
    <div class="pv" id="pv"></div>
    <div class="msg" id="msg"></div>
    <div class="kb" id="kb"><div class="sug" id="sug"></div><div class="body" id="body"></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
if(window.Android)root.classList.add("ime");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=["qwertyuiop","asdfghjkl","zxcvbnm"],S=["1234567890","@#$%&-+()/","*\"':;!?"];
const W=["the","thanks","tomorrow","hello","how","you","are","see","soon","love","please","great","good","morning","today","okay","maybe","tonight"];
const RAW={
Smileys:"😀 grin happy;😃 smile joy;😄 laugh happy;😁 beam grin;😆 laughing squint;🥹 tears touched grateful;😂 laugh cry lol funny;🙂 smile slight;😉 wink;😊 blush happy;😇 angel halo;🥰 love hearts adore;😍 heart eyes love;🤩 star struck wow;😘 kiss;😋 yum tasty;😛 tongue;🤪 crazy silly;🤗 hug;🤔 think hmm;🫡 salute;😐 neutral;😴 sleep tired;😎 cool sunglasses;🥳 party celebrate;😢 sad cry;😭 sob crying;😤 angry huff;😡 mad angry;🥺 pleading puppy;😱 scream shock;🤯 mind blown;😅 sweat nervous;🙃 upside down;😌 relieved calm;😏 smirk;🙄 eye roll;😬 grimace;🤭 oops giggle;🤫 shh quiet;😮 surprised wow;🥱 yawn;🤒 sick;😷 mask",
People:"👍 thumbs up yes good;👎 thumbs down no;👏 clap applause;🙌 hooray hands;🙏 pray thanks please;🤝 handshake deal;👋 wave hello bye;✌️ peace victory;🤞 fingers crossed luck;🫶 heart hands love;💪 strong muscle;👀 eyes look;🧠 brain;👶 baby;🧒 child kid;👩 woman;👨 man;🧓 older person;👵 grandmother;👴 grandfather;👌 ok perfect;🤙 call me;🫰 snap",
Animals:"🐶 dog puppy;🐱 cat kitten;🐭 mouse;🐹 hamster;🐰 rabbit bunny;🦊 fox;🐻 bear;🐼 panda;🐨 koala;🐯 tiger;🦁 lion;🐸 frog;🐵 monkey;🐔 chicken;🐧 penguin;🦉 owl;🦋 butterfly;🐢 turtle;🐙 octopus;🐳 whale;🦄 unicorn;🌸 blossom flower;🌻 sunflower;🌲 tree;🐘 elephant;🦒 giraffe;🐝 bee",
Food:"🍎 apple;🍌 banana;🍓 strawberry;🍉 watermelon;🍕 pizza;🍔 burger;🍟 fries;🌮 taco;🍜 noodles ramen;🍣 sushi;🍩 donut;🍪 cookie;🍦 ice cream;🎂 birthday cake;☕ coffee tea;🍵 green tea;🥛 milk;🥭 mango;🍛 curry;🫓 flatbread roti",
Travel:"🚗 car;🚕 taxi;🚌 bus;🚲 bike;✈️ plane flight;🚀 rocket;🚂 train;⛵ boat;🏠 home house;🏝️ island beach;🏔️ mountain;🌅 sunrise;🌙 moon night;⭐ star;☀️ sun;🌧️ rain;❄️ snow;🌈 rainbow",
Activity:"⚽ football soccer;🏀 basketball;🏏 cricket;🎾 tennis;🎮 game controller;🎲 dice;🎨 art paint;🎸 guitar;🎧 headphones music;🎬 movie;📚 books study;🏆 trophy win;🧩 puzzle;🪁 kite;🎉 party popper;🎈 balloon",
Objects:"📱 phone;💻 laptop computer;⌚ watch;📷 camera;💡 idea bulb;🔑 key;🔒 lock;🎁 gift;📌 pin;✏️ pencil write;📅 calendar date;💼 briefcase work;🧳 luggage travel;🔋 battery;💰 money;📞 call",
Symbols:"❤️ red heart love;🧡 orange heart;💛 yellow heart;💚 green heart;💙 blue heart;💜 purple heart;🖤 black heart;✨ sparkles;🔥 fire hot;💯 hundred;✅ check done;❌ cross no;❓ question;❗ exclamation;➕ plus;♾️ infinity;💔 broken heart;🎵 music note"};
const EM={},ALL=[];
for(const c in RAW){EM[c]=RAW[c].split(";").map(s=>{const i=s.indexOf(" ");return{e:s.slice(0,i),k:s.slice(i+1)}});ALL.push(...EM[c])}
const ICON={Smileys:"🙂",People:"👋",Animals:"🐶",Food:"🍎",Travel:"✈️",Activity:"⚽",Objects:"💡",Symbols:"❤️",Recent:"🕘"};
const PACKS={
Everyone:["Smileys","People","Animals","Food","Travel","Activity","Objects","Symbols"],
Kids:["Animals","Food","Activity","Smileys","Travel","People","Symbols","Objects"],
Teens:["Smileys","Symbols","Activity","People","Objects","Animals","Food","Travel"],
Adults:["Objects","Travel","Food","People","Symbols","Smileys","Animals","Activity"],
Seniors:["People","Symbols","Food","Animals","Travel","Smileys","Objects","Activity"]};
let txt="",shift=true,mode="abc",pack="Everyone",cat=0,recent=[],q="",clips=[],atts=[],msgs=[],vl="en-IN",live=false,rec=null,vmsg="Tap the mic and speak";
try{clips=JSON.parse(localStorage.getItem("km_clips")||"[]")}catch(_){}
const persist=()=>{try{localStorage.setItem("km_clips",JSON.stringify(clips.filter(c=>c.t)))}catch(_){}};
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const I={shift:svg('<path d="M12 4l8 9h-5v7H9v-7H4z"/>'),bs:svg('<path d="M21 6H9l-6 6 6 6h12z"/><path d="M13 10l4 4M17 10l-4 4"/>'),en:svg('<path d="M4 12l16-8-6 16-3-7z"/>'),emo:svg('<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/>'),mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),clip:svg('<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4h6v1M9 11h6M9 15h4"/>'),find:svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>')};
const AL={bs:"Backspace",en:"Send",shift:"Shift",emo:"Emoji",sym:"Numbers and symbols",abc:"Letters",sp:"Space",vstop:"Letters",sym2:"More symbols"};
const key=(l,k,c="")=>`<button class="k ${c}" data-k="${k}" aria-label="${AL[k]||k}"${c.includes("act")?' aria-pressed="true"':""}>${l}</button>`;
const order=()=>(recent.length?["Recent"]:[]).concat(PACKS[pack]);
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
let pm="abc";
function body(){
  const b=$("#body");b.className="body"+(mode==="es"?" mini":"")+(mode!==pm?" in":"");pm=mode;
  if(mode==="emo"){
    const o=order(),n=o[cat]||o[0],list=n==="Recent"?recent:EM[n].map(x=>x.e);
    b.innerHTML=`<div class="packs"><button data-k="es" class="srch">${I.find}Search emoji</button>${Object.keys(PACKS).map(p=>`<button data-p="${p}" class="${p===pack?"on":""}" aria-pressed="${p===pack}">${p}</button>`).join("")}</div>
    <div class="grid ${pack==="Seniors"?"lg":""}">${list.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>
    <div class="tabs">${key("ABC","abc","fn")}${o.map((x,i)=>`<button data-c="${i}" class="${i===cat?"on":""}" aria-label="${x}" aria-pressed="${i===cat}">${ICON[x]}</button>`).join("")}${key(I.bs,"bs","fn")}</div>`;return}
  if(mode==="es"){
    const s=q.toLowerCase().trim(),res=(s?ALL.filter(x=>x.k.includes(s)):ALL).slice(0,40);
    b.innerHTML=`<div class="qbar">${I.find}<span>${q?esc(q):"<span class=ph>Search emoji</span>"}</span><i class="caret"></i></div>
    <div class="${s?"res":"chips"}">${s?(res.length?res.map(x=>`<button data-e="${x.e}" aria-label="${x.k}">${x.e}</button>`).join(""):"<span class=ph>No match</span>"):["love","lol","happy","sad","food","party","cat","fire","thanks","cricket"].map(w=>`<button data-q="${w}">${w}</button>`).join("")}</div>
    ${[0,1,2].map(i=>`<div class="row ${i==1?"pad":""}">${[...L[i]].map(c=>key(c,c)).join("")}${i==2?key(I.bs,"bs","fn"):""}</div>`).join("")}
    <div class="row">${key("Back","emo","fn")}${key("space","sp","sp")}</div>`;return}
  if(mode==="clip"){
    b.innerHTML=`<div class="chd"><b>Clipboard</b><span><button data-k="clipsave">Save copied</button><button data-k="clipclr">Clear</button></span></div>
    <div class="cg">${clips.length?clips.map((c,i)=>`<div class="cc"><button data-ci="${i}" class="${c.img?"im":""}">${c.img?`<img src="${c.img}" alt="Saved screenshot">`:esc(c.t)}</button><button class="x" data-cd="${i}" aria-label="Delete">×</button></div>`).join(""):"<p class=ph>Copy text or paste a screenshot (Ctrl+V) and it will be saved here.</p>"}</div>
    <div class="tabs">${key("ABC","abc","fn")}</div>`;return}
  if(mode==="voice"){
    b.innerHTML=`<div class="vo"><div class="langs"><button data-vl="en-IN" class="${vl==="en-IN"?"on":""}">English</button><button data-vl="hi-IN" class="${vl==="hi-IN"?"on":""}">हिन्दी</button></div>
    <button class="mic ${live?"live":""}" data-k="vtoggle" aria-label="Start or stop voice typing">${I.mic}</button>
    <p id="vt" role="status" aria-live="polite">${esc(vmsg)}</p><p class="hint">Say “send”, “enter” or “bhej” to send the message.</p></div>
    <div class="tabs">${key("ABC","vstop","fn")}</div>`;return}
  const r=mode==="abc"?L:S,up=mode==="abc"&&shift,ch=s=>[...s].map(c=>key(up?c.toUpperCase():c,c)).join("");
  b.innerHTML=`<div class="row">${ch(r[0])}</div><div class="row pad">${ch(r[1])}</div>
  <div class="row">${mode==="abc"?key(I.shift,"shift","fn"+(shift?" act":"")):key("=\\<","sym2","fn")}${ch(r[2])}${key(I.bs,"bs","fn")}</div>
  <div class="row">${key(mode==="abc"?"?123":"ABC",mode==="abc"?"sym":"abc","fn")}${key(I.emo,"emo","fn")}${key("Keymold","sp","sp")}${key(".",".")}${key(I.en,"en","en")}</div>`;
}
const IME=!!window.Android;let lastTxt="";
function sync(){let i=0;const a=lastTxt,b=txt,n=Math.min(a.length,b.length);while(i<n&&a[i]===b[i])i++;const del=a.length-i,ins=b.slice(i);if(del||ins)Android.edit(del,ins);lastTxt=b;if(b.length>300)txt=lastTxt=b.slice(-100)}
let lm=-1,la=-1;
function out(){
  if(IME)sync();
  const c=document.querySelector("#msg .text .caret"),p=c&&c.previousSibling;
  if(p&&p.nodeType===3&&txt&&lm===msgs.length&&la===atts.length){p.nodeValue=txt;$("#msg").scrollTop=1e9;return tail()}
  lm=msgs.length;la=atts.length;outFull();
}
function outFull(){
  const m=$("#msg");m.innerHTML="";
  msgs.forEach(x=>{const d=document.createElement("div");d.className="bub"+(x.n?" new":"");x.n=0;x.i.forEach(s=>{const im=new Image();im.src=s;im.alt="Attachment";d.append(im)});if(x.t)d.append(document.createTextNode(x.t));m.append(d)});
  const t=document.createElement("div");t.className="text";
  atts.forEach(s=>{const im=new Image();im.src=s;im.alt="Attachment";im.className="th";t.append(im)});
  if(!txt&&!atts.length){const s=document.createElement("span");s.className="ph";s.textContent="Type a message";t.append(s)}else t.append(document.createTextNode(txt));
  const c=document.createElement("i");c.className="caret";t.append(c);m.append(t);m.scrollTop=m.scrollHeight;
  tail()}
function tail(){const f=(txt.match(/[a-z']+$/i)||[""])[0].toLowerCase(),s=(f?W.filter(w=>w.startsWith(f)&&w!==f):[]).slice(0,3);
  while(s.length<3)s.push(["I","The","Thanks"][s.length]);
  $("#sug").innerHTML=`<button class="ic" data-k="clip" aria-label="Clipboard">${I.clip}</button>${s.map(w=>`<button data-w="${w}">${w}</button>`).join("")}<button class="ic" data-k="mic" aria-label="Voice typing">${I.mic}</button>`;
  const ns=/(^|[.!?]\s|\n)$/.test(txt);if(ns!==shift){shift=ns;if(mode==="abc")body()}
}
function send(){if(IME){Android.enter();txt=lastTxt="";return out()}const t=txt.trim();if(!t&&!atts.length)return;msgs.push({t,i:atts,n:1});txt="";atts=[];out()}
function press(k){
  if(k==="es"){mode="es";q="";return body()}
  if(mode==="es"&&k!=="emo"){q=k==="bs"?q.slice(0,-1):k==="sp"?q+" ":q+k;return body()}
  if(k==="mic"){mode="voice";body();return startV()}
  if(k==="clip"){mode="clip";return body()}
  if(k==="clipsave")return saveClip();
  if(k==="clipclr"){if(!window._ca){window._ca=1;toast("Tap Clear again to delete everything");setTimeout(()=>window._ca=0,3000);return}window._ca=0;clips=[];persist();return body()}
  if(k==="vtoggle"){if(live){stopV();return body()}return startV()}
  if(k==="vstop"){stopV();mode="abc";return body()}
  if(k==="shift"){shift=!shift;return body()}
  if(k==="sym"||k==="abc"||k==="emo"){mode=k;cat=0;q="";return body()}
  if(k==="sym2")return;

  if(k==="en")return send();
  if(k==="bs"){if(IME){Android.back();lastTxt=txt.slice(0,-1)}txt=txt.slice(0,-1)}else if(k==="sp")txt+=" ";else txt+=(mode==="abc"&&shift?k.toUpperCase():k);
  out();
}
function typing(){kb.classList.add("typing");clearTimeout(window._ty);window._ty=setTimeout(()=>kb.classList.remove("typing"),1400)}
const rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function addClip(c){if(c.t&&!c.t.trim())return;clips=clips.filter(x=>!(c.t&&x.t===c.t));clips.unshift(c);clips=clips.slice(0,30);persist();if(mode==="clip")body();toast("Saved to clipboard")}
async function saveClip(){
  try{for(const it of await navigator.clipboard.read()){const ty=it.types.find(t=>t.startsWith("image/"));
    if(ty)addClip({img:await rd(await it.getType(ty))});else if(it.types.includes("text/plain"))addClip({t:await(await it.getType("text/plain")).text()})}}
  catch(_){toast("Allow clipboard access, or press Ctrl+V")}
}
document.addEventListener("copy",()=>{const s=String(getSelection());if(s)addClip({t:s})});
document.addEventListener("paste",e=>{for(const it of e.clipboardData.items){if(it.type.startsWith("image/"))rd(it.getAsFile()).then(img=>addClip({img}));else if(it.type==="text/plain")it.getAsString(t=>addClip({t}))}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(m){vmsg=m;const v=$("#vt");if(v)v.textContent=m}
function voiceText(t){
  t=t.trim();const m=t.match(/^(.*?)(?:^|[\s,.!])(send|enter|bhej(?:o| do)?|सेंड|एंटर|भेज(?:ो| दो)?)[\s.!]*$/i),add=p=>{if(p)txt+=(txt&&!/\s$/.test(txt)?" ":"")+p};
  if(m){add(m[1].trim());out();send()}else{add(t);out()}
}
function startV(){
  if(!SR){say("Voice typing isn’t supported in this browser. Try Chrome or Edge.");return}
  rec=new SR();rec.lang=vl;rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)voiceText(r[0].transcript);else it+=r[0].transcript}say(it||"Listening…")};
  rec.onerror=e=>{live=false;say(/not-allowed|service/.test(e.error)?"Microphone is blocked here. Allow mic access, or open the link in its own tab.":"Voice error: "+e.error);body()};
  rec.onend=()=>{if(live&&mode==="voice"){try{rec.start()}catch(_){}}else{live=false;if(mode==="voice")body()}};
  try{rec.start();live=true;say("Listening…");body()}catch(_){}
}
function stopV(){live=false;try{rec&&rec.stop()}catch(_){}}
const kb=$("#kb");
function hit(e){
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.k!==undefined){t.classList.add("on");press(d.k);try{if(IME&&Android.tick)Android.tick();else navigator.vibrate&&navigator.vibrate(6)}catch(_){}}

  else if(d.w){const base=txt.replace(/[a-z']+$/i,"");txt=base+(shift&&!base?d.w[0].toUpperCase()+d.w.slice(1):d.w)+" ";out()}
  else if(d.p){pack=d.p;cat=0;body()}
  else if(d.c){cat=+d.c;body()}
  else if(d.ci!==undefined){const c=clips[+d.ci];if(c.img)atts.push(c.img);else txt+=c.t;out();toast("Added")}

const fast=t=>t.dataset.k!==undefined||t.dataset.w!==undefined;
const pv=$("#pv"),phn=document.querySelector(".phone");
function showPv(t){const k=t.dataset.k;if((mode!=="abc"&&mode!=="sym")||!k||k.length!==1||t.classList.contains("fn"))return;const r=t.getBoundingClientRect(),p=phn.getBoundingClientRect();pv.textContent=t.textContent;pv.style.left=r.left-p.left+r.width/2+"px";pv.style.top=r.top-p.top-4+"px";pv.classList.add("on")}
let rt,ri;const stopR=()=>{clearTimeout(rt);clearInterval(ri)};
kb.addEventListener("pointerdown",e=>{const t=e.target.closest("button");if(t&&fast(t)){e.preventDefault();hit(e);if(t.dataset.k==="bs"){stopR();rt=setTimeout(()=>{ri=setInterval(()=>press("bs"),45)},380)}}});
kb.addEventListener("click",e=>{const t=e.target.closest("button");if(t&&(!fast(t)||e.detail===0))hit(e)});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{document.querySelectorAll(".k.on").forEach(k=>k.classList.remove("on"));pv.classList.remove("on");stopR()}));
$("#sizes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;SZ.h=+b.dataset.h;applySz()});
const AC=[["#f0a93b","#1a1204"],["#4f9dff","#04101f"],["#3ddc97","#03150d"],["#ff6b8b","#200610"],["#a78bfa","#0e0720"],["#ffffff","#000000"]];
$("#pop").innerHTML=`Background<div class="r">${["amoled:AMOLED","dim:Dim","light:Light"].map(x=>`<button data-tm="${x.split(":")[0]}">${x.split(":")[1]}</button>`).join("")}</div>
Accent<div class="r">${AC.map((a,i)=>`<button class="dot" data-ac="${i}" style="background:${a[0]}" aria-label="Accent ${i+1}"></button>`).join("")}</div>

const mark=()=>document.querySelectorAll("#pop [data-tm]").forEach(b=>b.classList.toggle("on",b.dataset.tm===root.dataset.theme));mark();

$("#pop").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;

const SZ={h:54,w:100,p:"c"};
