  if(d.ac){CFG.ac=+d.ac;root.style.setProperty("--accent",AC[d.ac][0]);root.style.setProperty("--ink",AC[d.ac][1]);mark();saveCfg()}
  if(d.es){CFG.es=d.es;root.style.setProperty("--ef",d.es==="a"?EFA:EFS);mark();saveCfg()}});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest("button"))return;
  const k=e.key;if(k==="ArrowLeft"||k==="ArrowRight"){moveCur(k==="ArrowLeft"?-1:1);e.preventDefault();return}
  if(mode==="emo"&&/^[a-z]$/i.test(k)){mode="es";q=k.toLowerCase();return body()}
  if(!["abc","sym","num","es"].includes(mode)||(mode==="es"&&k==="Enter"))return;
  if(k==="Backspace")press("bs");else if(k==="Enter")press("en");else if(k===" ")press("sp");else if(k.length===1)press(mode==="abc"?k.toLowerCase():k);else return;
  e.preventDefault();
});
const SZ={h:54,w:100,p:"c"};

function applySz(quiet){
  kb.style.setProperty("--kh",SZ.h+"px");kb.style.setProperty("--kw",SZ.w+"%");kb.style.setProperty("--ka",{l:"flex-start",c:"center",r:"flex-end"}[SZ.p]);
  $("#sh").value=SZ.h;$("#sw").value=SZ.w;
  document.querySelectorAll("#pop [data-pos]").forEach(b=>b.classList.toggle("on",b.dataset.pos===SZ.p));
  document.querySelectorAll("#sizes button").forEach(x=>x.classList.toggle("on",+x.dataset.h===SZ.h));
  if(!quiet)saveCfg();
  if(IME)Android.height(40+4*(SZ.h+8)+24);
}
$("#sh").oninput=e=>{SZ.h=+e.target.value;applySz()};
$("#sw").oninput=e=>{SZ.w=+e.target.value;applySz()};
function saveCfg(){const o={...CFG,h:SZ.h,w:SZ.w,p:SZ.p};try{localStorage.setItem("km_cfg",JSON.stringify(o))}catch(_){}if(window.AppBridge)AppBridge.save(JSON.stringify(o))}
let sp=null;
function moveCur(n){if(IME){Android.move(n);txt=lastTxt="";return out()}cur=Math.max(0,Math.min(txt.length,C()+n));out()}
document.addEventListener("pointermove",e=>{if(!sp)return;if(!sp.drag&&Math.abs(e.clientX-sp.x)>12){sp.drag=true;sp.last=e.clientX;sp.el.classList.add("drag");sp.el.textContent="◀  ▶"}if(sp.drag){const n=Math.trunc((e.clientX-sp.last)/9);if(n){sp.last+=n*9;moveCur(n)}}});
function endSp(e){if(!sp)return;const s=sp;sp=null;s.el.classList.remove("drag","on");s.el.textContent="Keymold";if(!s.drag&&e.type==="pointerup")press("sp")}
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,endSp));
window.applyCfg=function(c){
  if(c.theme)CFG.theme=c.theme;if(typeof c.ac==="number")CFG.ac=c.ac;if(c.es)CFG.es=c.es;
  if(c.h)SZ.h=+c.h;if(c.w)SZ.w=+c.w;if(c.p)SZ.p=c.p;
  root.dataset.theme=CFG.theme;root.style.setProperty("--accent",AC[CFG.ac][0]);root.style.setProperty("--ink",AC[CFG.ac][1]);root.style.setProperty("--ef",CFG.es==="a"?EFA:EFS);
  mark();applySz(true);
};
try{applyCfg(JSON.parse(localStorage.getItem("km_cfg")||"{}"))}catch(_){applySz(true)}
if(window.AppBridge)saveCfg();
body();out();
</script>
